<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     role="img"
     aria-labelledby="title desc">
  <title id="title">TaskFence mark</title>
  <desc id="desc">An open geometric boundary with a single approved check-shaped path passing through its gate.</desc>

  <!-- The pale boundary carries a dark keyline so it stays defined on light and dark surfaces. -->
  <path d="M8 8H56V24H48V16H16V48H48V40H56V56H8Z"
        fill="#F3F0E7"
        stroke="#17233A"
        stroke-width="2.5"
        stroke-linejoin="miter"/>

  <!-- A dark guard stroke preserves the permitted path against either background. -->
  <path d="M21 34L30 43L53 28"
        fill="none"
        stroke="#17233A"
        stroke-width="9"
        stroke-linecap="square"
        stroke-linejoin="miter"/>
  <path d="M21 34L30 43L53 28"
        fill="none"
        stroke="#F06B4F"
        stroke-width="5"
        stroke-linecap="square"
        stroke-linejoin="miter"/>
</svg>
