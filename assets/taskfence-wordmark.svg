<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 576 128"
     role="img"
     aria-labelledby="title desc">
  <title id="title">TaskFence wordmark</title>
  <desc id="desc">The TaskFence gate mark followed by a custom geometric, all-capital TaskFence wordmark.</desc>

  <defs>
    <!-- Original single-line letter geometry: TASKFENCE. -->
    <path id="taskfence-letters"
          d="M0 0H34M17 0V52
             M48 52L58 0H72L82 52M54 31H76
             M130 0H102L96 6V22H124L130 28V46L124 52H96
             M144 0V52M178 0L144 31M158 18L178 52
             M192 52V0H226M192 25H219
             M274 0H240V52H274M240 26H267
             M288 52V0L322 52V0
             M370 0H342L336 6V46L342 52H370
             M418 0H384V52H418M384 26H411"/>
  </defs>

  <g transform="translate(12 16) scale(1.5)">
    <path d="M8 8H56V24H48V16H16V48H48V40H56V56H8Z"
          fill="#F3F0E7"
          stroke="#17233A"
          stroke-width="2.5"
          stroke-linejoin="miter"/>
    <path d="M21 34L30 43L53 28"
          fill="none"
          stroke="#17233A"
          stroke-width="9"
          stroke-linecap="square"
          stroke-linejoin="miter"/>
    <path d="M21 34L30 43L53 28"
          fill="none"
          stroke="#F06B4F"
          stroke-width="5"
          stroke-linecap="square"
          stroke-linejoin="miter"/>
  </g>

  <!-- Dark keyline plus pale face makes the text independent of its host theme. -->
  <g transform="translate(132 38)"
     fill="none"
     stroke-linecap="square"
     stroke-linejoin="miter">
    <use href="#taskfence-letters"
         stroke="#17233A"
         stroke-width="10"/>
    <use href="#taskfence-letters"
         stroke="#F3F0E7"
         stroke-width="6"/>
  </g>
</svg>
