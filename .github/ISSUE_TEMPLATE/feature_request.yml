name: Feature request
description: Propose a focused TaskFence capability or runtime integration
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What enforcement, recovery, or integration gap cannot be solved today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior, including fail-closed semantics and affected runtime hooks.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Note authority, path, command, persistence, host-version, or backwards-compatibility implications.
    validations:
      required: true
